<script>

const PALETTE = ["#4E79A7", "#F28E2B", "#9C755F", "#B07AA1", "#76B7B2", "#EDC948", "#59A14F"];
const MAX_COUNTRIES = 5;
const DEFAULT_COUNTRIES = ["Malawi", "Serbia", "Costa Rica"];
const CARRIED_FILL = "#9ca3af";
const SIZE_TICKS = 4;

const X = "gdp_per_cap_ppp_2021_dollars";
const Y = "life_evaluation";
const S = "social_support";

const ROSLING = { width: 378, height: 500, margin: { top: 28, right: 16, bottom: 42, left: 50 } };

const SLOPE   = { width: 336, height: 500, margin: { top: 28, right: 104, bottom: 42, left: 54 } };
const LEGEND  = { width: 148 };

let ALL = [];
let BY_COUNTRY = new Map();
let COUNTRIES = [];
let YEARS = [];
let FIT = null;
let SIZE = null;
let selected = [];
let year = null;

const tip = d3.select("#tip");

function prepare(raw) {
  const rows = raw.map(d => ({
    country: d.country,
    year: +d.year,
    [Y]: d[Y] === "" || d[Y] == null ? null : +d[Y],
    [X]: d[X] === "" || d[X] == null ? null : +d[X],
    [S]: d[S] === "" || d[S] == null ? null : +d[S]
  })).filter(d => d.country && Number.isFinite(d.year));

  const allYears = Array.from(new Set(rows.map(d => d.year))).sort(d3.ascending);
  const out = [];

  for (const [country, recs] of d3.group(rows, d => d.country)) {
    recs.sort((a, b) => a.year - b.year);
    const byYear = new Map(recs.map(r => [r.year, r]));
    let last = null;

    for (const yr of allYears) {
      const r = byYear.get(yr);
      const hasX = !!r && Number.isFinite(r[X]);
      const hasY = !!r && Number.isFinite(r[Y]);
      const hasS = !!r && Number.isFinite(r[S]);

      const rec = {
        country, year: yr,
        [X]: hasX ? r[X] : (last ? last[X] : null),
        [Y]: hasY ? r[Y] : (last ? last[Y] : null),
        [S]: hasS ? r[S] : (last ? last[S] : null),
        gdpImputed: !hasX,
        supportImputed: !hasS,
      };

      rec.observed = hasX && hasY;
      rec.sourceYear = rec.observed ? yr : (last ? last.sourceYear : null);
      rec.carried = !rec.observed && rec[X] != null && rec[Y] != null;

      if (rec[X] == null || rec[Y] == null) continue;

      out.push(rec);
      last = rec;
    }
  }
  return out;
}

function ols(rows) {
  const pts = rows.filter(d => Number.isFinite(d[X]) && Number.isFinite(d[Y]));
  if (pts.length < 2) return null;
  const mx = d3.mean(pts, d => d[X]);
  const my = d3.mean(pts, d => d[Y]);
  let num = 0, den = 0;
  for (const p of pts) {
    num += (p[X] - mx) * (p[Y] - my);
    den += (p[X] - mx) ** 2;
  }
  if (den === 0) return null;
  const m = num / den;
  let dy = 0;
  for (const p of pts) dy += (p[Y] - my) ** 2;
  const r = dy === 0 ? null : num / Math.sqrt(den * dy);
  return { m, b: my - m * mx, r, n: pts.length };
}

function readEmbeddedFit() {
  const node = document.getElementById("embedded-fit");
  if (!node) return null;
  const txt = node.textContent
    .replace("/* FIT-START */", "")
    .replace("/* FIT-END */", "")
    .trim();
  if (!txt) return null;
  try {
    const f = JSON.parse(txt);
    return Number.isFinite(f.m) && Number.isFinite(f.b) ? f : null;
  } catch (e) {
    return null;
  }
}

function buildSizeScale(rows) {
  const vals = rows.map(d => d[S]).filter(Number.isFinite).sort(d3.ascending);
  if (!vals.length) return d3.scaleSqrt().domain([0, 1]).range([4, 17]).clamp(true);

  const lo = d3.quantileSorted(vals, 0.05);
  const hi = d3.quantileSorted(vals, 0.95);
  const step = 0.1;
  let dLo = Math.floor(lo / step) * step;
  let dHi = Math.ceil(hi / step) * step;
  if (dHi - dLo < step) dHi = dLo + step;

  const s = d3.scaleSqrt().domain([dLo, dHi]).range([4, 17]).clamp(true);
  s.rawDomain = [dLo, dHi];
  return s;
}

function colorOf(country) {
  const i = selected.indexOf(country);
  return i === -1 ? "#9ca3af" : PALETTE[i % PALETTE.length];
}

function renderControls() {
  const box = d3.select("#controls");
  box.selectAll("*").remove();

  box.append("span").attr("class", "controls-label").text("Countries:");

  selected.forEach(c => {
    const chip = box.append("span").attr("class", "chip");
    chip.append("span").attr("class", "dot").style("background", colorOf(c));
    chip.append("span").text(c);
    chip.append("button")
      .attr("title", `Remove ${c}`)
      .html("&times;")
      .on("click", () => {
        selected = selected.filter(x => x !== c);
        renderControls();
        renderAll();
      });
  });

  const atMax = selected.length >= MAX_COUNTRIES;
  const sel = box.append("select")
    .attr("id", "add")
    .property("disabled", atMax)
    .on("change", function () {
      const v = this.value;
      if (!v) return;
      if (!selected.includes(v) && selected.length < MAX_COUNTRIES) selected.push(v);
      renderControls();
      renderAll();
    });

  sel.append("option").attr("value", "").text(atMax ? `Max ${MAX_COUNTRIES} reached` : "+ Add country…");
  COUNTRIES.filter(c => !selected.includes(c)).forEach(c => {
    sel.append("option").attr("value", c).text(c);
  });

  d3.select("#hint").text(
    atMax
      ? `Showing ${MAX_COUNTRIES} of ${MAX_COUNTRIES} — remove one to add another.`
      : `${selected.length} selected · up to ${MAX_COUNTRIES}.`
  );
}

function renderRosling() {
  const { width, height, margin } = ROSLING;
  const iw = width - margin.left - margin.right;
  const ih = height - margin.top - margin.bottom;

  const svg = d3.select("#rosling").attr("width", width).attr("height", height);
  svg.selectAll("*").remove();
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const rows = ALL.filter(d => selected.includes(d.country) && Number.isFinite(d[X]) && Number.isFinite(d[Y]));

  const maxGdp = (d3.max(rows, d => d[X]) ?? 10000) + 10000;
  const x = d3.scaleLinear().domain([0, maxGdp]).range([0, iw]).nice();
  const y = d3.scaleLinear().domain([0, 8]).range([ih, 0]);

  const size = SIZE;

  svg.append("text")
    .attr("class", "panel-title")
    .attr("x", margin.left + iw / 2).attr("y", 18)
    .text("Country trajectories over time");

  g.append("g").attr("class", "grid")
    .attr("transform", `translate(0,${ih})`)
    .call(d3.axisBottom(x).ticks(6).tickSize(-ih).tickFormat(""));
  g.append("g").attr("class", "grid")
    .call(d3.axisLeft(y).ticks(6).tickSize(-iw).tickFormat(""));

  g.append("g")
    .attr("transform", `translate(0,${ih})`)
    .call(d3.axisBottom(x).ticks(6).tickFormat(d3.format(",")));
  g.append("g").call(d3.axisLeft(y).ticks(6));

  svg.append("text").attr("class", "axis-title")
    .attr("x", margin.left + iw / 2).attr("y", height - 10)
    .attr("text-anchor", "middle").text("GDP Per Capita");
  svg.append("text").attr("class", "axis-title")
    .attr("transform", `rotate(-90)`)
    .attr("x", -(margin.top + ih / 2)).attr("y", 15)
    .attr("text-anchor", "middle").text("Happiness Score");

  if (FIT) {
    const [x0, x1] = x.domain();
    const pts = [[x0, FIT.m * x0 + FIT.b], [x1, FIT.m * x1 + FIT.b]]
      .map(([px, py]) => [x(px), y(Math.max(0, Math.min(8, py)))]);
    g.append("line")
      .attr("x1", pts[0][0]).attr("y1", pts[0][1])
      .attr("x2", pts[1][0]).attr("y2", pts[1][1])
      .attr("stroke", "#000").attr("stroke-width", 2)
      .attr("stroke-dasharray", "4,4").attr("opacity", 0.6);

    if (Number.isFinite(FIT.r)) {
      g.append("text")
        .attr("x", iw - 4).attr("y", ih - 8)
        .attr("text-anchor", "end")
        .attr("font-size", 12).attr("font-weight", 700).attr("fill", "#374151")
        .text(`r = ${FIT.r.toFixed(2)}`);
    }
  }

  const line = d3.line()
    .curve(d3.curveCatmullRom.alpha(0.5))
    .x(d => x(d[X]))
    .y(d => y(d[Y]));

  selected.forEach(c => {
    const path = (BY_COUNTRY.get(c) || [])
      .filter(d => d.year <= year && Number.isFinite(d[X]) && Number.isFinite(d[Y]));
    if (path.length < 2) return;
    g.append("path")
      .datum(path)
      .attr("fill", "none")
      .attr("stroke", colorOf(c))
      .attr("stroke-width", 2)
      .attr("stroke-linecap", "round")
      .attr("opacity", 0.55)
      .attr("d", line);
  });

  const trail = [];
  selected.forEach(c => {
    (BY_COUNTRY.get(c) || []).forEach(d => {
      if (d.year <= year && Number.isFinite(d[X]) && Number.isFinite(d[Y])) trail.push(d);
    });
  });

  g.selectAll("circle.trail")
    .data(trail)
    .join("circle")
    .attr("class", "trail")
    .attr("cx", d => x(d[X]))
    .attr("cy", d => y(d[Y]))
    .attr("r", 2.2)
    .attr("fill", d => d.observed ? colorOf(d.country) : CARRIED_FILL)
    .attr("opacity", 0.9)
    .attr("stroke", "#fff")
    .attr("stroke-width", 0.75)
    .on("mousemove", showTip)
    .on("mouseleave", hideTip);

  const bubbles = selected
    .map(c => (BY_COUNTRY.get(c) || []).find(d => d.year === year))
    .filter(d => d && Number.isFinite(d[X]) && Number.isFinite(d[Y]));

  g.selectAll("circle.bubble")
    .data(bubbles, d => d.country)
    .join("circle")
    .attr("class", "bubble")
    .attr("cx", d => x(d[X]))
    .attr("cy", d => y(d[Y]))
    .attr("r", d => Number.isFinite(d[S]) ? size(d[S]) : 5)

    .attr("fill", d => d.carried ? CARRIED_FILL : colorOf(d.country))
    .attr("opacity", 0.95)
    .attr("stroke", d => d.carried ? colorOf(d.country) : "#fff")
    .attr("stroke-width", d => d.carried ? 2 : 1)
    .attr("stroke-dasharray", d => d.carried ? "3,2" : null)
    .on("mousemove", showTip)
    .on("mouseleave", hideTip);
}

function renderSlope() {
  const { width, height, margin } = SLOPE;
  const iw = width - margin.left - margin.right;
  const ih = height - margin.top - margin.bottom;
  const firstYear = YEARS[0], lastYear = YEARS[YEARS.length - 1];

  const svg = d3.select("#slope").attr("width", width).attr("height", height);
  svg.selectAll("*").remove();
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const pairs = [];
  selected.forEach(c => {
    const recs = (BY_COUNTRY.get(c) || []).filter(d => Number.isFinite(d[Y]));
    if (!recs.length) return;
    const start = recs.find(d => d.year === firstYear) ?? recs[0];
    const end = recs.find(d => d.year === lastYear) ?? recs[recs.length - 1];
    if (start === end) return;
    pairs.push({ country: c, start, end, diff: end[Y] - start[Y], col: colorOf(c) });
  });

  const x = d3.scalePoint().domain([firstYear, lastYear]).range([0, iw]).padding(0.5);

  const vals = pairs.flatMap(p => [p.start[Y], p.end[Y]]);
  let lo = d3.min(vals), hi = d3.max(vals);
  if (!Number.isFinite(lo)) { lo = 0; hi = 8; }
  const pad = Math.max((hi - lo) * 0.12, 0.25);
  const y = d3.scaleLinear().domain([lo - pad, hi + pad]).range([ih, 0]).nice();

  svg.append("text").attr("class", "panel-title")
    .attr("x", margin.left + iw / 2).attr("y", 18)
    .text(`Happiness Score Change: ${firstYear} → ${lastYear}`);

  g.append("g").attr("class", "grid")
    .call(d3.axisLeft(y).ticks(6).tickSize(-iw).tickFormat(""));
  g.append("g").call(d3.axisLeft(y).ticks(6).tickFormat(d3.format(".1f")));

  [firstYear, lastYear].forEach(yr => {
    g.append("line")
      .attr("x1", x(yr)).attr("x2", x(yr))
      .attr("y1", 0).attr("y2", ih)
      .attr("stroke", "#e5e7eb").attr("stroke-width", 1);
  });

  g.append("g")
    .attr("transform", `translate(0,${ih})`)
    .call(d3.axisBottom(x).tickFormat(d3.format("d")))
    .call(s => s.selectAll("text").attr("font-size", 12).attr("font-weight", 700));

  svg.append("text").attr("class", "axis-title")
    .attr("x", margin.left + iw / 2).attr("y", height - 10)
    .attr("text-anchor", "middle").text("Year");

  svg.append("text").attr("class", "axis-title")
    .attr("transform", "rotate(-90)")
    .attr("x", -(margin.top + ih / 2)).attr("y", 15)
    .attr("text-anchor", "middle").text("Happiness Score");

  pairs.forEach(p => {
    g.append("line")
      .attr("x1", x(firstYear)).attr("y1", y(p.start[Y]))
      .attr("x2", x(lastYear)).attr("y2", y(p.end[Y]))
      .attr("stroke", p.col).attr("stroke-width", 2.5);

    [[firstYear, p.start], [lastYear, p.end]].forEach(([yr, rec]) => {
      g.append("circle")
        .datum(rec)
        .attr("cx", x(yr)).attr("cy", y(rec[Y])).attr("r", 5.4)
        .attr("fill", p.col).attr("stroke", "#fff").attr("stroke-width", 1)
        .on("mousemove", showTip).on("mouseleave", hideTip);
    });
  });

  function placeLabels(side) {
    const isStart = side === "start";
    const items = pairs.map(p => {
      const v = isStart ? p.start[Y] : p.end[Y];
      return {
        col: p.col,
        anchorY: y(v),
        labelY: y(v),
        text: isStart
          ? v.toFixed(2)
          : `${v.toFixed(2)} (${p.diff >= 0 ? "+" : ""}${p.diff.toFixed(2)})`
      };
    }).sort((a, b) => a.labelY - b.labelY);

    const gap = 13;
    for (let i = 1; i < items.length; i++) {
      if (items[i].labelY - items[i - 1].labelY < gap) items[i].labelY = items[i - 1].labelY + gap;
    }
    const overflow = items.length ? items[items.length - 1].labelY - ih : 0;
    if (overflow > 0) {
      items.forEach(it => it.labelY -= overflow);
      for (let i = items.length - 2; i >= 0; i--) {
        if (items[i + 1].labelY - items[i].labelY < gap) items[i].labelY = items[i + 1].labelY - gap;
      }
    }

    const px = isStart ? x(firstYear) : x(lastYear);
    const dir = isStart ? -1 : 1;

    items.forEach(it => {
      if (Math.abs(it.labelY - it.anchorY) > 3) {
        g.append("polyline")
          .attr("points", [
            [px + dir * 8, it.anchorY],
            [px + dir * 13, it.labelY],
            [px + dir * 16, it.labelY]
          ].map(p => p.join(",")).join(" "))
          .attr("fill", "none").attr("stroke", it.col)
          .attr("stroke-width", 1).attr("opacity", 0.45);
      }
      g.append("text")
        .attr("x", px + dir * 18).attr("y", it.labelY + 4)
        .attr("text-anchor", isStart ? "end" : "start")
        .attr("font-size", 11).attr("font-variant-numeric", "tabular-nums")
        .attr("fill", it.col)
        .text(it.text);
    });
  }

  placeLabels("start");
  placeLabels("end");
}

function renderLegend() {
  const svg = d3.select("#legend").attr("width", LEGEND.width);
  svg.selectAll("*").remove();
  let ty = 34;

  svg.append("text").attr("class", "legend-title").attr("x", 8).attr("y", ty).text("Country");
  ty += 16;

  selected.forEach(c => {
    svg.append("circle").attr("cx", 15).attr("cy", ty - 4).attr("r", 5.5)
      .attr("fill", colorOf(c)).attr("opacity", 0.95)
      .attr("stroke", "#fff").attr("stroke-width", 1);
    svg.append("text").attr("class", "legend-item").attr("x", 28).attr("y", ty).text(c);
    ty += 18;
  });

  svg.append("line")
    .attr("x1", 9).attr("y1", ty - 4).attr("x2", 22).attr("y2", ty - 4)
    .attr("stroke", "#000").attr("stroke-dasharray", "4,4").attr("stroke-width", 2).attr("opacity", 0.6);
  svg.append("text").attr("class", "legend-item").attr("x", 28).attr("y", ty).text("Best fit line");
  ty += 22;

  svg.append("circle").attr("cx", 15).attr("cy", ty - 4).attr("r", 5.5)
    .attr("fill", CARRIED_FILL).attr("stroke", "#6b7280")
    .attr("stroke-width", 1.5).attr("stroke-dasharray", "3,2");
  svg.append("text").attr("class", "legend-item").attr("x", 28).attr("y", ty)
    .text("No reading this year");
  ty += 30;

  const size = SIZE;
  const dom = SIZE && SIZE.rawDomain;
  if (!size || !dom) { svg.attr("height", ty + 10); return; }

  svg.append("text").attr("class", "legend-title").attr("x", 8).attr("y", ty).text("Social Support");
  ty += 10;

  const fmt = d3.format(".2~f");
  let ticks = d3.ticks(dom[0], dom[1], SIZE_TICKS).filter(t => t >= dom[0] && t <= dom[1]);
  if (ticks.length > SIZE_TICKS) {
    const n = ticks.length - 1;
    ticks = [...new Set(
      d3.range(SIZE_TICKS).map(i => ticks[Math.round(i * n / (SIZE_TICKS - 1))])
    )];
  }

  const maxR = size(dom[1]);
  const cx = 12 + maxR;

  ticks.forEach(t => {
    const r = size(t);
    ty += r + 7;
    svg.append("circle").attr("cx", cx).attr("cy", ty).attr("r", r)
      .attr("fill", "#111827").attr("opacity", 0.85)
      .attr("stroke", "#fff").attr("stroke-width", 1);
    svg.append("text").attr("class", "legend-item")
      .attr("x", cx + maxR + 10).attr("y", ty + 4).text(fmt(t));
    ty += r + 5;
  });

  ty += 14;
  svg.append("text")
    .attr("x", 8).attr("y", ty)
    .attr("font-size", 10).attr("fill", "#6b7280")
    .text("Fixed scale, all countries;");
  svg.append("text")
    .attr("x", 8).attr("y", ty + 12)
    .attr("font-size", 10).attr("fill", "#6b7280")
    .text("outliers clamped to the ends.");

  svg.attr("height", Math.max(500, ty + 20));
}

function showTip(event, d) {
  const fmt = d3.format(",.0f");
  const flag = d.observed
    ? ""
    : `<br><i style="opacity:.75">no ${d.year} reading — showing ${d.sourceYear ?? "earlier"} values</i>`;
  tip.html(
    `<b>${d.country}</b> · ${d.year}<br>` +
    `Happiness score: ${d[Y] == null ? "—" : d[Y].toFixed(2)}<br>` +
    `GDP per capita: ${Number.isFinite(d[X]) ? "$" + fmt(d[X]) : "—"}<br>` +
    `Social support: ${Number.isFinite(d[S]) ? d[S].toFixed(2) : "—"}${flag}`
  )
    .style("left", (event.pageX + 14) + "px")
    .style("top", (event.pageY - 12) + "px")
    .style("opacity", 1);
}
function hideTip() { tip.style("opacity", 0); }

function renderAll() {
  renderRosling();
  renderSlope();
  renderLegend();
}

function boot(raw) {
  ALL = prepare(raw);
  BY_COUNTRY = d3.group(ALL, d => d.country);
  COUNTRIES = Array.from(BY_COUNTRY.keys()).sort(d3.ascending);
  YEARS = Array.from(new Set(ALL.map(d => d.year))).sort(d3.ascending);
  FIT = readEmbeddedFit() || ols(ALL);
  SIZE = buildSizeScale(ALL);
  year = YEARS[YEARS.length - 1];

  selected = DEFAULT_COUNTRIES.filter(c => COUNTRIES.includes(c));
  if (!selected.length) selected = COUNTRIES.slice(0, 3);

  const slider = d3.select("#year")
    .attr("min", YEARS[0])
    .attr("max", YEARS[YEARS.length - 1])
    .attr("step", 1)
    .property("value", year)
    .on("input", function () {
      year = +this.value;
      d3.select("#yearVal").text(year);
      renderRosling();
    });
  d3.select("#yearVal").text(year);

  d3.select("#loader").classed("hidden", true);
  d3.select("#app").style("display", "block");
  renderControls();
  renderAll();
}

document.getElementById("file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  boot(d3.csvParse(await f.text()));
});

(function () {
  const node = document.getElementById("embedded-data");
  if (!node) return;
  const csv = node.textContent
    .replace("/* DATA-START */", "")
    .replace("/* DATA-END */", "")
    .trim();
  if (csv) boot(d3.csvParse(csv));
})();

</script>
